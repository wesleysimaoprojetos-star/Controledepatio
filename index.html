<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F4C700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Controle de Pátio - Lemar Transportes</title>

    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel (Para rodar o código React direto no navegador sem necessidade de npm build) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase v8 (Compatível para uso direto em HTML) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #F4C700; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4ac00; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // CONFIGURAÇÃO DO BANCO DE DADOS (FIREBASE)
        // Substitua pelos seus dados do Firebase se desejar sincronização em tempo real
        // ==========================================
        const firebaseConfig = {
            apiKey: "COLOQUE_SUA_API_KEY_AQUI",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "000000000",
            appId: "1:000000:web:abcdefg"
        };

        let auth = null;
        let db = null;
        let firebaseInitialized = false;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            db.settings({ experimentalForceLongPolling: true });
            firebaseInitialized = true;
        } catch (e) {
            console.warn("Modo Offline ativado devido a configuração pendente.", e);
        }
        
        const DEFAULT_CONFIGS = {
            operacoes: ['Inbound', 'Outbound', 'Transferência', 'Cross-docking'],
            tipos: ['Encoste', 'Retirada', 'Troca de Carreta', 'Manobra'],
            docas: ['01', '02', '03', '15A', '15B'],
            solicitantes: ['Mercado Livre - Inbound', 'Mercado Livre - Outbound'],
            lideres: []
        };

        function App() {
            const [user, setUser] = useState({ uid: 'offline-user' });
            const [imageError, setImageError] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(!firebaseInitialized || firebaseConfig.projectId === "seu-projeto");
            
            const [requests, setRequests] = useState(() => {
                const saved = localStorage.getItem('lemar_requests');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [configs, setConfigs] = useState(() => {
                const saved = localStorage.getItem('lemar_configs');
                return saved ? JSON.parse(saved) : DEFAULT_CONFIGS;
            });

            const [activeTab, setActiveTab] = useState('nova');
            const [loading, setLoading] = useState(false);

            // Form State
            const [formData, setFormData] = useState({ lider: '', solicitante: '', doca: '', operacao: '', tipo: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submittedRequest, setSubmittedRequest] = useState(null);

            // Filter State
            const [filters, setFilters] = useState({ status: 'Todos', operacao: 'Todos', tipo: 'Todos' });
            const [showFilters, setShowFilters] = useState(false);

            // Config State
            const [configEdits, setConfigEdits] = useState(configs);
            const [newContato, setNewContato] = useState({ nome: '', numero: '', liderId: null });

            useEffect(() => {
                if (isOfflineMode) {
                    localStorage.setItem('lemar_requests', JSON.stringify(requests));
                }
            }, [requests, isOfflineMode]);

            useEffect(() => {
                if (isOfflineMode) {
                    localStorage.setItem('lemar_configs', JSON.stringify(configs));
                }
            }, [configs, isOfflineMode]);

            // --- AUTH & DATA FETCHING ---
            useEffect(() => {
                if (!firebaseInitialized || !auth || isOfflineMode) {
                    setLoading(false);
                    return;
                }

                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        auth.signInAnonymously().catch(err => {
                            console.warn("Auth falhou, ativando armazenamento local.", err);
                            setIsOfflineMode(true);
                        });
                    }
                });
                return () => {
                    if (unsubscribeAuth) unsubscribeAuth();
                };
            }, [isOfflineMode]);

            useEffect(() => {
                if (!firebaseInitialized || !db || isOfflineMode) {
                    setLoading(false);
                    return;
                }

                const unsubscribeReq = db.collection('yard_requests')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => {
                            const timeA = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt.seconds * 1000 || 0)) : Date.now();
                            const timeB = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt.seconds * 1000 || 0)) : Date.now();
                            return timeB - timeA;
                        });
                        setRequests(data);
                        setIsOfflineMode(false);
                    }, (error) => {
                        console.warn("Firestore inacessível. Operando em modo de segurança local.", error);
                        setIsOfflineMode(true);
                    });

                const configRef = db.collection('settings').doc('main');
                const unsubscribeConf = configRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        setConfigs(data);
                        setConfigEdits(data);
                    } else {
                        configRef.set(DEFAULT_CONFIGS).catch(() => {});
                    }
                    setLoading(false);
                }, (error) => {
                    console.warn("Erro ao buscar configurações no Firestore. Usando cache local.", error);
                    setIsOfflineMode(true);
                    setLoading(false);
                });

                return () => {
                    if (unsubscribeReq) unsubscribeReq();
                    if (unsubscribeConf) unsubscribeConf();
                };
            }, [user, isOfflineMode]);

            // --- ACTIONS ---
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.lider || !formData.solicitante || !formData.doca || !formData.operacao || !formData.tipo) return;

                setIsSubmitting(true);
                try {
                    const localId = 'req-' + Date.now();
                    const newRequest = {
                        id: localId,
                        ...formData,
                        status: 'Pendente',
                        createdAt: { seconds: Math.floor(Date.now() / 1000) },
                        completedAt: null,
                        createdBy: user?.uid || 'local'
                    };
                    
                    if (!isOfflineMode && db) {
                        try {
                            const docRef = await db.collection('yard_requests').add({
                                ...formData,
                                status: 'Pendente',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                completedAt: null,
                                createdBy: user?.uid || 'local'
                            });
                            newRequest.id = docRef.id;
                        } catch (err) {
                            console.warn("Salvando localmente devido a falha de escrita no Firestore:", err);
                            setIsOfflineMode(true);
                        }
                    }
                    
                    setRequests(prev => [newRequest, ...prev]);
                    setSubmittedRequest(newRequest);
                    setFormData({ lider: '', solicitante: '', doca: '', operacao: '', tipo: '' });
                } catch (error) {
                    console.error("Erro ao registrar:", error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleMarkCompleted = async (id) => {
                const nowSec = Math.floor(Date.now() / 1000);
                setRequests(prev => prev.map(req => req.id === id ? { ...req, status: 'Atendida', completedAt: { seconds: nowSec } } : req));

                if (!isOfflineMode && db && !id.startsWith('req-')) {
                    try {
                        await db.collection('yard_requests').doc(id).update({
                            status: 'Atendida',
                            completedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (error) {
                        console.warn("Erro ao atualizar no Firestore, atualizado localmente.", error);
                    }
                }
            };

            // --- CONFIG ACTIONS ---
            const saveConfigsToDB = async (newConfigs) => {
                setConfigs(newConfigs);
                if (!isOfflineMode && db) {
                    try {
                        await db.collection('settings').doc('main').set(newConfigs);
                    } catch (e) {
                        console.warn("Configurações salvas apenas localmente.");
                    }
                }
            };

            const handleAddSimpleConfig = (field, value) => {
                if (!value.trim()) return;
                const updated = { ...configEdits, [field]: [...(configEdits[field] || []), value.trim()] };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
            };

            const handleRemoveSimpleConfig = (field, index) => {
                const updatedList = [...configEdits[field]];
                updatedList.splice(index, 1);
                const updated = { ...configEdits, [field]: updatedList };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
            };

            const handleAddLider = (nome) => {
                if (!nome.trim()) return;
                const novoLider = { id: Date.now().toString(), nome: nome.trim(), contatos: [] };
                const updated = { ...configEdits, lideres: [...(configEdits.lideres || []), novoLider] };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
            };

            const handleRemoveLider = (id) => {
                const updated = { ...configEdits, lideres: configEdits.lideres.filter(s => s.id !== id) };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
            };

            const handleAddContato = (liderId) => {
                if (!newContato.nome.trim() || !newContato.numero.trim()) return;
                
                const updatedLideres = configEdits.lideres.map(s => {
                    if (s.id === liderId) {
                        return { ...s, contatos: [...(s.contatos || []), { nome: newContato.nome.trim(), numero: newContato.numero.trim().replace(/\D/g, '') }] };
                    }
                    return s;
                });

                const updated = { ...configEdits, lideres: updatedLideres };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
                setNewContato({ nome: '', numero: '', liderId: null });
            };

            const handleRemoveContato = (liderId, contatoIndex) => {
                const updatedLideres = configEdits.lideres.map(s => {
                    if (s.id === liderId) {
                        const novosContatos = [...s.contatos];
                        novosContatos.splice(contatoIndex, 1);
                        return { ...s, contatos: novosContatos };
                    }
                    return s;
                });
                const updated = { ...configEdits, lideres: updatedLideres };
                setConfigEdits(updated);
                saveConfigsToDB(updated);
            };

            // --- UTILS ---
            const formatTimeDifference = (start, end) => {
                if (!start || !end) return '-';
                const startTime = start.toMillis ? start.toMillis() : (start.seconds * 1000 || Date.now());
                const endTime = end.toMillis ? end.toMillis() : (end.seconds * 1000 || Date.now());
                const diffMs = endTime - startTime;
                const diffMins = Math.max(0, Math.floor(diffMs / 60000));
                if (diffMins < 60) return `${diffMins} min`;
                return `${Math.floor(diffMins / 60)}h ${diffMins % 60}m`;
            };

            const generateWhatsAppLink = (request, numero = null) => {
                const text = `*LEMAR - Solicitação de Pátio*%0A%0A` +
                             `👷‍♂️ *Líder:* ${request.lider}%0A` +
                             `👤 *Solicitante:* ${request.solicitante}%0A` +
                             `📍 *Doca:* ${request.doca}%0A` +
                             `🚛 *Operação:* ${request.operacao}%0A` +
                             `🔄 *Tipo:* ${request.tipo}%0A%0A` +
                             `_Enviado pelo App de Controle_`;
                             
                if (numero) {
                    return `https://api.whatsapp.com/send?phone=55${numero}&text=${text}`;
                }
                return `https://api.whatsapp.com/send?text=${text}`;
            };

            // --- FILTERING ---
            const filteredRequests = useMemo(() => {
                return requests.filter(req => {
                    if (filters.status !== 'Todos' && req.status !== filters.status) return false;
                    if (filters.operacao !== 'Todos' && req.operacao !== filters.operacao) return false;
                    if (filters.tipo !== 'Todos' && req.tipo !== filters.tipo) return false;
                    return true;
                });
            }, [requests, filters]);

            const pendingRequests = useMemo(() => requests.filter(r => r.status === 'Pendente'), [requests]);

            const getContatosForLider = (nomeLider) => {
                const lider = configs.lideres?.find(s => s.nome === nomeLider);
                return lider ? (lider.contatos || []) : [];
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-[#F4C700]"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {/* HEADER */}
                    <header className="bg-white shadow-md sticky top-0 z-10 border-b-4 border-[#F4C700]">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                {!imageError ? (
                                    <img 
                                        src="image_dcb328.png" 
                                        alt="Lemar Transportes" 
                                        className="h-12 md:h-16 object-contain" 
                                        onError={() => setImageError(true)}
                                    />
                                ) : (
                                    <div className="flex flex-col justify-center items-start">
                                        <span className="text-3xl font-black italic tracking-tighter leading-none text-black">LEMAR</span>
                                        <span className="text-[10px] font-bold leading-none tracking-widest text-black mt-1">TRANSPORTES</span>
                                    </div>
                                )}
                                <div className="border-l-2 border-gray-400 pl-3 ml-1 hidden sm:block">
                                    <span className="text-xs text-gray-500 uppercase tracking-widest font-bold italic block leading-tight">Controle de</span>
                                    <span className="text-sm text-black uppercase tracking-wider font-extrabold italic block leading-tight">Pátio</span>
                                </div>
                            </div>
                            
                            {isOfflineMode && (
                                <div className="bg-amber-100 border border-amber-300 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                                    <i className="fas fa-info-circle"></i> Modo Local Ativo
                                </div>
                            )}
                        </div>
                        
                        {/* TABS */}
                        <div className="flex border-t border-gray-200 bg-black">
                            <button onClick={() => setActiveTab('nova')} className={`flex-1 py-4 text-xs sm:text-sm font-extrabold italic uppercase tracking-wider flex justify-center items-center gap-2 transition-colors ${activeTab === 'nova' ? 'bg-[#F4C700] text-black border-b-4 border-black' : 'text-gray-300 hover:text-white'}`}>
                                <i className="fas fa-plus-circle"></i> <span className="hidden sm:inline">Nova Solicitação</span><span className="sm:hidden">Nova</span>
                            </button>
                            <button onClick={() => setActiveTab('painel')} className={`flex-1 py-4 text-xs sm:text-sm font-extrabold italic uppercase tracking-wider flex justify-center items-center gap-2 transition-colors ${activeTab === 'painel' ? 'bg-[#F4C700] text-black border-b-4 border-black' : 'text-gray-300 hover:text-white'}`}>
                                <i className="fas fa-clipboard-list"></i> Painel
                            </button>
                            <button onClick={() => setActiveTab('config')} className={`flex-1 py-4 text-xs sm:text-sm font-extrabold italic uppercase tracking-wider flex justify-center items-center gap-2 transition-colors ${activeTab === 'config' ? 'bg-[#F4C700] text-black border-b-4 border-black' : 'text-gray-300 hover:text-white'}`}>
                                <i className="fas fa-cog"></i> Config
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-grow p-4 md:p-6 max-w-5xl mx-auto w-full pb-24">
                        
                        {/* --- TAB: NOVA --- */}
                        {activeTab === 'nova' && (
                            <div className="space-y-6 max-w-lg mx-auto">
                                {submittedRequest && (
                                    <div className="bg-white rounded-xl shadow-lg p-6 text-center border-2 border-black relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-2 bg-[#F4C700]"></div>
                                        <div className="w-14 h-14 bg-[#F4C700] text-black rounded-full flex items-center justify-center mx-auto mb-3 shadow-md">
                                            <i className="fas fa-check text-2xl"></i>
                                        </div>
                                        <h2 className="text-xl font-extrabold italic text-black mb-1">REGISTRADA!</h2>
                                        
                                        <div className="bg-gray-100 p-4 rounded-lg text-left text-sm font-bold text-black mb-4 border border-gray-200">
                                            <p><span className="text-gray-500">Líder:</span> {submittedRequest.lider}</p>
                                            <p><span className="text-gray-500">Solicitante:</span> {submittedRequest.solicitante}</p>
                                            <p><span className="text-gray-500">Doca:</span> {submittedRequest.doca}</p>
                                        </div>

                                        <div className="space-y-2">
                                            {getContatosForLider(submittedRequest.lider).length > 0 ? (
                                                getContatosForLider(submittedRequest.lider).map((contato, idx) => (
                                                    <a key={idx} href={generateWhatsAppLink(submittedRequest, contato.numero)} target="_blank" rel="noopener noreferrer" className="w-full bg-[#25D366] text-white font-extrabold italic py-3 px-4 rounded-xl flex items-center justify-between shadow-md text-sm uppercase">
                                                        <span><i className="fab fa-whatsapp text-lg mr-2"></i> {contato.nome}</span>
                                                        <span className="text-xs opacity-75">{contato.numero}</span>
                                                    </a>
                                                ))
                                            ) : (
                                                <a href={generateWhatsAppLink(submittedRequest)} target="_blank" rel="noopener noreferrer" className="w-full bg-[#25D366] text-white font-extrabold italic py-3 px-4 rounded-xl flex items-center justify-center shadow-md text-sm uppercase">
                                                    <i className="fab fa-whatsapp text-lg mr-2"></i> Enviar WhatsApp (Avulso)
                                                </a>
                                            )}
                                            <button onClick={() => setSubmittedRequest(null)} className="w-full bg-black text-[#F4C700] font-bold py-3 rounded-xl mt-2 uppercase italic">Ocultar</button>
                                        </div>
                                    </div>
                                )}

                                <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow-md p-5 space-y-4">
                                    <h2 className="text-lg font-extrabold italic text-black border-b-2 border-[#F4C700] pb-2 uppercase"><i className="fas fa-truck text-[#F4C700]"></i> Nova Movimentação</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-extrabold text-gray-500 uppercase">Líder de Pátio</label>
                                            <select name="lider" required value={formData.lider} onChange={handleInputChange} className="w-full p-3 border-2 rounded-lg bg-gray-50 font-bold text-black focus:ring-2 focus:ring-[#F4C700] outline-none">
                                                <option value="" disabled>Selecione...</option>
                                                {(configs.lideres || []).map(s => <option key={s.id} value={s.nome}>{s.nome}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-extrabold text-gray-500 uppercase">Solicitante (ML)</label>
                                            <select name="solicitante" required value={formData.solicitante} onChange={handleInputChange} className="w-full p-3 border-2 rounded-lg bg-gray-50 font-bold text-black focus:ring-2 focus:ring-[#F4C700] outline-none">
                                                <option value="" disabled>Selecione...</option>
                                                {(configs.solicitantes || []).map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-extrabold text-gray-500 uppercase">Doca</label>
                                            <select name="doca" required value={formData.doca} onChange={handleInputChange} className="w-full p-3 border-2 rounded-lg bg-gray-50 font-bold text-black focus:ring-2 focus:ring-[#F4C700] outline-none">
                                                <option value="" disabled>Selecione...</option>
                                                {(configs.docas || []).map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-extrabold text-gray-500 uppercase">Operação</label>
                                            <select name="operacao" required value={formData.operacao} onChange={handleInputChange} className="w-full p-3 border-2 rounded-lg bg-gray-50 font-bold text-black focus:ring-2 focus:ring-[#F4C700] outline-none">
                                                <option value="" disabled>Selecione...</option>
                                                {(configs.operacoes || []).map(op => <option key={op} value={op}>{op}</option>)}
                                            </select>
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-extrabold text-gray-500 uppercase">Tipo</label>
                                            <select name="tipo" required value={formData.tipo} onChange={handleInputChange} className="w-full p-3 border-2 rounded-lg bg-gray-50 font-bold text-black focus:ring-2 focus:ring-[#F4C700] outline-none">
                                                <option value="" disabled>Selecione...</option>
                                                {(configs.tipos || []).map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-[#F4C700] text-black font-extrabold italic uppercase py-4 rounded-xl shadow-md mt-4">
                                        {isSubmitting ? 'Registrando...' : 'Registrar Solicitação'}
                                    </button>
                                </form>

                                <div className="mt-8">
                                    <h3 className="text-sm font-extrabold text-gray-500 uppercase mb-3"><i className="fas fa-clock"></i> Pendentes no Pátio ({pendingRequests.length})</h3>
                                    <div className="space-y-3">
                                        {pendingRequests.length === 0 ? (
                                            <div className="text-center p-4 bg-gray-200 rounded-xl text-gray-500 font-bold text-sm italic">Pátio Limpo. Nenhuma pendência.</div>
                                        ) : (
                                            pendingRequests.map(req => (
                                                <div key={req.id} className="bg-white rounded-xl shadow-sm border-l-4 border-[#F4C700] p-3 flex justify-between items-center">
                                                    <div>
                                                        <div className="font-extrabold text-black text-lg">Doca {req.doca} <span className="text-xs bg-gray-100 text-gray-600 px-2 rounded ml-1 font-bold">{req.tipo}</span></div>
                                                        <p className="text-xs font-bold text-gray-500">Líder: {req.lider}</p>
                                                    </div>
                                                    <button onClick={() => handleMarkCompleted(req.id)} className="bg-black text-[#F4C700] p-3 rounded-lg flex flex-col items-center min-w-[80px]">
                                                        <i className="fas fa-check-circle text-lg mb-1"></i><span className="text-[10px] font-extrabold uppercase">Concluir</span>
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- TAB: PAINEL --- */}
                        {activeTab === 'painel' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                                    <div className="font-bold text-gray-500 uppercase text-sm">Total: <span className="text-black font-extrabold text-lg">{filteredRequests.length}</span></div>
                                    <button onClick={() => setShowFilters(!showFilters)} className="bg-[#F4C700] text-black px-4 py-2 rounded-lg font-extrabold uppercase text-xs">
                                        <i className="fas fa-filter"></i> Filtros
                                    </button>
                                </div>
                                {showFilters && (
                                    <div className="bg-white p-4 rounded-xl shadow-md border-t-4 border-[#F4C700] grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div><label className="text-[10px] font-extrabold text-gray-500 uppercase">Status</label><select value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})} className="w-full mt-1 p-2 border-2 rounded bg-gray-50 font-bold"><option value="Todos">Todos</option><option value="Pendente">Pendente</option><option value="Atendida">Atendida</option></select></div>
                                        <div><label className="text-[10px] font-extrabold text-gray-500 uppercase">Operação</label><select value={filters.operacao} onChange={e => setFilters({...filters, operacao: e.target.value})} className="w-full mt-1 p-2 border-2 rounded bg-gray-50 font-bold"><option value="Todos">Todas</option>{(configs.operacoes || []).map(op => <option key={op} value={op}>{op}</option>)}</select></div>
                                        <div><label className="text-[10px] font-extrabold text-gray-500 uppercase">Tipo</label><select value={filters.tipo} onChange={e => setFilters({...filters, tipo: e.target.value})} className="w-full mt-1 p-2 border-2 rounded bg-gray-50 font-bold"><option value="Todos">Todos</option>{(configs.tipos || []).map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                                    </div>
                                )}
                                <div className="space-y-3">
                                    {filteredRequests.map(req => {
                                        const sTime = req.createdAt?.seconds ? new Date(req.createdAt.seconds * 1000) : new Date();
                                        const cTime = req.completedAt?.seconds ? new Date(req.completedAt.seconds * 1000) : null;
                                        return (
                                            <div key={req.id} className={`bg-white rounded-xl shadow-sm border-l-4 ${req.status === 'Pendente' ? 'border-[#F4C700]' : 'border-black'}`}>
                                                <div className="p-4">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className={`px-2 py-1 text-[10px] font-extrabold rounded uppercase ${req.status === 'Pendente' ? 'bg-[#F4C700] text-black' : 'bg-black text-[#F4C700]'}`}>{req.status}</span>
                                                        {cTime && <span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">Tempo: {formatTimeDifference(req.createdAt, req.completedAt)}</span>}
                                                    </div>
                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                                                        <div><p className="text-[10px] text-gray-500 font-bold uppercase">Doca</p><p className="font-extrabold text-black text-lg">{req.doca}</p></div>
                                                        <div><p className="text-[10px] text-gray-500 font-bold uppercase">Líder</p><p className="font-bold text-black text-xs">{req.lider}</p></div>
                                                        <div><p className="text-[10px] text-gray-500 font-bold uppercase">Operação</p><p className="text-xs font-bold text-black">{req.operacao}</p></div>
                                                        <div><p className="text-[10px] text-gray-500 font-bold uppercase">Tipo</p><p className="text-xs font-bold text-black">{req.tipo}</p></div>
                                                    </div>
                                                    <div className="text-[10px] font-bold text-gray-400 border-t pt-2">
                                                        Solicitado: {sTime.toLocaleString()} 
                                                        {cTime && ` | Concluído: ${cTime.toLocaleTimeString()}`}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* --- TAB: CONFIG --- */}
                        {activeTab === 'config' && (
                            <div className="space-y-6 max-w-2xl mx-auto">
                                <div className="bg-white rounded-xl shadow-md p-5">
                                    <h2 className="text-lg font-extrabold italic border-b-2 border-[#F4C700] pb-2 uppercase mb-4"><i className="fas fa-users text-[#F4C700]"></i> Líderes e Equipe (WhatsApp)</h2>
                                    <div className="flex gap-2 mb-6">
                                        <input type="text" id="novo_lider" placeholder="Nome do Líder..." className="flex-1 p-3 border-2 rounded-lg text-sm font-bold" />
                                        <button onClick={() => { const inp = document.getElementById('novo_lider'); handleAddLider(inp.value); inp.value=''; }} className="bg-black text-white px-4 rounded-lg font-bold">Add</button>
                                    </div>
                                    <div className="space-y-4">
                                        {(configEdits.lideres || []).map(lider => (
                                            <div key={lider.id} className="border-2 rounded-xl p-4 bg-gray-50">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h3 className="font-extrabold text-lg">{lider.nome}</h3>
                                                    <button onClick={() => handleRemoveLider(lider.id)} className="text-red-500"><i className="fas fa-trash"></i></button>
                                                </div>
                                                <div className="pl-2 border-l-2 border-[#F4C700] space-y-2">
                                                    <p className="text-xs font-bold text-gray-500 uppercase">Contatos (WhatsApp)</p>
                                                    {(lider.contatos || []).map((cont, idx) => (
                                                        <div key={idx} className="flex justify-between bg-white p-2 border rounded text-sm"><span className="font-bold">{cont.nome} <span className="text-gray-400 font-normal">{cont.numero}</span></span><button onClick={() => handleRemoveContato(lider.id, idx)} className="text-red-400"><i className="fas fa-times"></i></button></div>
                                                    ))}
                                                    {newContato.liderId === lider.id ? (
                                                        <div className="flex gap-2 mt-2">
                                                            <input type="text" placeholder="Nome" value={newContato.nome} onChange={e => setNewContato({...newContato, nome: e.target.value})} className="flex-1 p-2 border rounded text-sm"/>
                                                            <input type="text" placeholder="DDD+Numero" value={newContato.numero} onChange={e => setNewContato({...newContato, numero: e.target.value})} className="flex-1 p-2 border rounded text-sm"/>
                                                            <button onClick={() => handleAddContato(lider.id)} className="bg-[#F4C700] px-3 rounded font-bold text-xs">Salvar</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => setNewContato({nome:'', numero:'', liderId: lider.id})} className="text-xs font-bold text-[#F4C700] bg-black px-3 py-1.5 rounded">+ Contato</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {['docas', 'solicitantes', 'operacoes', 'tipos'].map(field => (
                                        <div key={field} className="bg-white rounded-xl shadow-md p-4">
                                            <h3 className="font-extrabold text-sm uppercase mb-3 border-b-2 pb-1">{field}</h3>
                                            <div className="flex gap-1 mb-3">
                                                <input type="text" id={`add_${field}`} className="flex-1 border p-2 rounded text-sm" placeholder="Adicionar..." />
                                                <button onClick={() => {const i = document.getElementById(`add_${field}`); handleAddSimpleConfig(field, i.value); i.value='';}} className="bg-black text-white px-3 rounded font-bold">+</button>
                                            </div>
                                            <div className="space-y-1 max-h-40 overflow-y-auto">
                                                {(configEdits[field] || []).map((item, idx) => (
                                                    <div key={idx} className="flex justify-between items-center text-sm p-1 border-b"><span className="font-bold">{item}</span><button onClick={() => handleRemoveSimpleConfig(field, idx)} className="text-red-400"><i className="fas fa-trash"></i></button></div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
